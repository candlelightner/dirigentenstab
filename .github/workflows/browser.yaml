name: Browser integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/candlelightner/dirigentenstab:test-runner-py3.12-pw1.64.1-8e89f79303a87df7@sha256:868b85c26da1d95c4b6faa989720d3bdc624da6311c119c5e3a619f1ab0349bf
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_runner.py prepare
      - name: Browser tests
        timeout-minutes: 4
        run: python scripts/test_runner.py run browser -- python -m pytest -q -m browser tests/test_browser.py --basetemp=browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-browser-results
          path: |
            browser-results/**/browser-server.log
            browser-results/**/*.png
          retention-days: 7

name: Browser integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: chromium (shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    container:
      image: ghcr.io/candlelightner/dirigentenstab:test-runner-py3.12-pw1.64.1-8825ff7ccb75b371@sha256:624e2bbe4eb7f7067a86184b16972283399956f288b26bea5de0db1f345db7ba
      options: --shm-size=1g
    env:
      HOME: /root
      BROWSER_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_runner.py prepare
      - name: Browser tests
        timeout-minutes: 8
        run: python scripts/test_runner.py run browser -- python -m pytest -q -m browser tests/test_browser.py --basetemp=browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-browser-results-${{ matrix.shard }}
          path: |
            browser-results/**/browser-server.log
            browser-results/**/*.png
          retention-days: 7

name: Browser integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -e '.[test]' playwright==1.64.1
      - run: python -m playwright install --with-deps --only-shell --no-remove chromium firefox
      - run: python -m pytest -q -m browser tests/test_browser.py --basetemp=browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-browser-results
          path: |
            browser-results/**/browser-server.log
            browser-results/**/*.png
          retention-days: 7

name: Publish versioned image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['pyproject.toml', '.github/workflows/release.yaml']
permissions:
  contents: write
  packages: write
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish only when the version changed
        id: check
        env:
          DS_BEFORE: ${{ github.event.before }}
        run: |
          read_version='import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])'
          DS_VERSION=$(python3 -c "$read_version" < pyproject.toml)
          DS_OLD=$(git show "$DS_BEFORE:pyproject.toml" 2>/dev/null | python3 -c "$read_version" 2>/dev/null || true)
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$DS_OLD" = "$DS_VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $DS_VERSION is unchanged, nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock -e '.[test,browser]' && ruff check . && pytest -q -m "not browser and not live"
      - name: Read and check release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DS_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -c 'import re,sys; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", sys.argv[1])' "$DS_VERSION"
          echo "version=$DS_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$DS_VERSION"; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$DS_VERSION" >/dev/null 2>&1; then
            DS_TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$DS_VERSION" --jq .sha)
            test "$DS_TAG_SHA" = "$GITHUB_SHA"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/candlelightner/dirigentenstab
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Publish release tag and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$DS_VERSION" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$DS_VERSION" -f "sha=$GITHUB_SHA"
          fi
          if ! gh release view "v$DS_VERSION" >/dev/null 2>&1; then
            gh release create "v$DS_VERSION" --verify-tag --title "Dirigentenstab v$DS_VERSION" --generate-notes
          fi

name: Publish test runner image

on:
  push:
    branches: [main, 'implementation/**', 'fix/**']
    paths:
      - 'Dockerfile.test-runner'
      - 'requirements.lock'
      - 'pyproject.toml'
      - 'scripts/test_runner.py'
      - '.github/workflows/test-runner.yaml'
  workflow_dispatch:
    inputs:
      security_rebuild:
        type: boolean
        default: true
        description: 'Rebuild without cache to pick up OS security updates'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: python3 scripts/test_runner.py github-output

      - uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test-runner
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.cache_scope }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.security_rebuild }}
          pull: ${{ github.event_name == 'workflow_dispatch' && inputs.security_rebuild }}

      - name: Verify image offline before publishing
        run: |
          docker run --rm --network none --shm-size=1g -v "$PWD:/work" -w /work \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            bash -c "python scripts/test_runner.py prepare --no-check-workflows && ruff check . && python scripts/test_runner.py run unit-smoke -- pytest -q -m 'not browser and not live' tests/test_setup.py tests/test_web.py"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test-runner
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.cache_scope }}
          provenance: true
          sbom: true

      - name: Record digest
        run: |
          echo "Pinned image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.push.outputs.digest }}"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "- **Pinned image**: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
